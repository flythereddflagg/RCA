  - id: mountain trail exit
    type: Edge
    image: ./assets/block/block.png
    mask: ./assets/block/block.png
    start: [1230,1038]
    scale: 2.5
    scene_path: ./assets/scene/placeholder.yaml
    exit_dir: UP
    groups: 
     - behind
  
  - id: red castle valley theme
    type: Music
    filename: ./assets/music/red_castle_valley.mp3
    groups: [paused]
    measure_time: 1.846
    sequence:
      # after 28 measures have played goto measure 30
      - [58, goto, 30]
      # after 28 measures have played goto measure 30
      - [28, goto, 30]
