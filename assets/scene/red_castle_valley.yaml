# layers specifies draw order
layers:
  - behind
  - background
  - foreground
  - overlay

nodes: # all children are nodes
  - id: BACKGROUND
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_bg.png
    mask: assets/scene/red_castle_valley/red_castle_valley_mask.png
    groups:
      - solid
      - background

  - id: foreground
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_overlay.png
    groups:
      - overlay

  - id: big ol rock
    type: Decal
    image: ./assets/block/big_ol_rock.png
    mask: ./assets/block/big_ol_rock.png
    start: [745,765]
    scale: 2
    groups: 
     - solid
     - foreground

  - yaml: ./assets/actor/rosie.yaml
    start: [870,91]
    groups: [foreground, solid, paused]

  - yaml: ./assets/actor/meatball.yaml
    start: [700, 200]
    # groups: [foreground, foe, paused]
    active: False
  
