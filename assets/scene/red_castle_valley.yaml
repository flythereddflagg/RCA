# layers specifies draw order
layers:
  - behind
  - background
  - foreground
  - overlay

# TODO implement this for all scenes and rewrite scene.py!
# layers are specified in the groups attribute
nodes: # all children are nodes
  - id: BACKGROUND
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_bg.png
    mask: assets/scene/red_castle_valley/red_castle_valley_mask.png
    groups:
      - solid
      - background

  - id: foreground
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_overlay.png
    groups:
      - overlay

  - id: big ol rock
    type: Decal
    image: ./assets/block/big_ol_rock.png
    mask: ./assets/block/big_ol_rock.png
    start: [745,765]
    scale: 2
    groups: 
     - solid
     - foreground

  - id: guard
    type: Gate
    key_id: jar of pickles
    image: ./assets/actor/other/guard_npc.png
    mask: ./assets/block/block.png
    start: [888,91]
    scale: 1
    groups: 
     - solid
     - foreground
