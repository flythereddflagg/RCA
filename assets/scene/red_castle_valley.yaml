# layers specifies draw order
layers:
  - behind
  - background
  - foreground
  - overlay

nodes: # all children are nodes
  - id: BACKGROUND
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_bg.png
    mask: assets/scene/red_castle_valley/red_castle_valley_mask.png
    groups:
      - solid
      - background

  - id: foreground
    type: Decal
    image: ./assets/scene/red_castle_valley/red_castle_valley_overlay.png
    groups:
      - overlay

  - id: big ol rock
    type: Decal
    image: ./assets/block/big_ol_rock.png
    mask: ./assets/block/big_ol_rock.png
    start: [745,765]
    scale: 2
    groups: 
     - solid
     - foreground

  - id: Rosie
    type: Rosie
    key_id: jar of pickles
    image: ./assets/actor/rosie/rosie_ref.png
    mask: ./assets/block/block.png
    start: [888,91]
    scale: 1
    groups: 
     - solid
     - foreground
     - paused
    children:
      - id: talking_head
        groups: [hud]
        type: Decal
        scale: 1.5
        children:
          - id: animation
            type: Animation
            path_prefix: "./assets/actor/rosie/"
            datafile: face.json
            default_state: Silent
            animation:
              Silent:
                repeat: True
              Resting:
                repeat: True
              Talking:
                repeat: True
      - id: textbox
        groups: [hud]
        type: TextBox
        font_size: 22
        text_padding: 3
        bg_color: [0,0,0,128]
        scroll_speed: 20
        box_size: [390,96]
        start: [200, 250]
        outline: true
        text: |-
          I don't have any clean Tupperware!
          ...Now, please, take a bite so I can watch you enjoy! 
          That's my favorite part!
