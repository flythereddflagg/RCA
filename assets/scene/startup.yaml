layers:
- foreground
nodes:

- id: startup_animation
  type: CutScene
  groups:
    - foreground  
  children:
    - id: animation
      type: Animation
      path_prefix: ./assets/scene/startup/
      default_state: titlescreen
      animation:
        intro:
          datafile: startup.json
          repeat: false
        titlescreen:
          datafile: mountain_rev2.json
          repeat: true
    - id: menu
      type: Menu

# TODO NEXT make a menu!


- filename: ./assets/music/RCA_OVERWORLD/RCA_titlescreen.mp3
  id: startup music
  type: Music
- groups:
  - other
  id: camera
  slack: 100
  type: Camera
  zoom: 1


