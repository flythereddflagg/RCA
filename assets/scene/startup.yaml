id: startup
zoom: 1 # amount to scale everything -1 means no camera
CAMERASLACK: 100 # pixels from center screen before the camera moves

layers: # layers will be drawn in this order
  - background
  - foreground

foreground:
  - id: startup_animation
    type: CutScene
    # start: [0, 50]
    image: ./assets/block/null.png
    path_prefix: ./assets/scene/startup/
    animations:
      intro:
        datafile: startup.json
        repeat: false
      titlescreen: 
        datafile: mountain_rev2.json
        repeat: true

  - id: startup music
    type: Music
    filename: ./assets/music/RCA_OVERWORLD/RCA_titlescreen.mp3


background:
  - id: null_bg
    type: Decal
    image: ./assets/block/null.png

