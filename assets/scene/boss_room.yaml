layers:
- behind
- background
- foreground
- overlay
- hud

nodes:
- id: boss room
  type: Decal
  groups:
  - solid
  - background
  image: ./assets/scene/boss_room/boss_room.png
  mask: ./assets/scene/boss_room/boss_room_mask.png

- groups:
  - foreground
  id: fey_frog
  start:
  - 84
  - 55
  yaml: ./assets/actor/fey_frog.yaml
  groups:
  - foe
  - foreground

# - id: sword
#   type: Item
#   action: sword
#   groups:
#   - foreground
#   image: ./assets/actor/item/sword_icon.png
#   mask: ./assets/actor/item/sword_icon.png
#   start: [500,100]

- exit_dir: DOWN
  groups:
  - behind
  id: grate exit
  image: ./assets/block/null.png
  mask: ./assets/block/block.png
  scale: 1
  scene_path: ./assets/scene/credits.yaml
  start: [-32,-32]
  type: Edge

- exit_dir: LEFT
  groups:
  - behind
  id: doorway exit
  image: ./assets/block/null.png
  mask: ./assets/block/block.png
  scale: 1
  scene_path: ./assets/scene/corridor.yaml
  start:
  - 630
  - 164
  type: Edge
- id: camera
  type: Camera
- groups:
  - overlay
  id: dark overlay
  image: ./assets/scene/boss_room/boss_room_overlay.png
  type: Decal
- id: boss_theme
  type: Music
  filename: ./assets/music/boss_theme_filled.mp3
  groups: [paused]
  measure_time: 1
  sequence:
    # after 28 measures have played goto measure 30
    - [0, goto, 23.8]
    - [83.4, goto, 23.8]
