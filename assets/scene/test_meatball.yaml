layers: [foreground]
nodes:
- groups:
  - solid
  - background
  id: boss room
  image: ./assets/scene/boss_room/boss_room.png
  mask: ./assets/scene/boss_room/boss_room_mask.png
  type: Decal
- id: camera
  type: Camera
- id: meatball
  type: MeatBall
  start: [300, 200]
  groups:
    - foreground
  children:
    - id: sprite
      type: Decal
    - id: animation
      type: Animation2
      path_prefix: ./assets/actor/meat_ball/
      datafile: base.json
      default_state: wiggle
    
    - id: hitmask
      type: HitMask
      sibling: animation
      kind: mask
      datafile: base_mask.json

  
