id: Rosie
type: Rosie
key_id: jar of pickles
image: ./assets/actor/rosie/rosie_cart.png
mask: ./assets/actor/rosie/rosie_cart_mask.png
scale: 1
children:
  - id: talking_head
    type: Decal
    scale: 1.5
    children:
      - id: animation
        type: Animation2
        path_prefix: ./assets/actor/rosie/
        datafile: face.json
        default_state: Silent
  - id: textbox
    type: TextBox
    font_size: 22
    text_padding: 3
    bg_color: [0,0,0,128]
    scroll_speed: 20
    box_size: [390,96]
    start: [200, 250]
    outline: true
    text: |-
      Oh hi Robbie! Grandpa went up to see what was going on around the manor. 
      He left me here so I set up my new shop. I'm selling MEATBALLS! But I 
      don't have any clean Tupperware!
  - id: cue_text
    type: TextBox
    font_size: 22
    text_padding: 3
    bg_color: [0,0,0,0]
    # scroll_speed: 20
    # box_size: [390,96]
    # start: [200, 250]
    outline: true
    text: |-
      Talk to Rosie
  - id: button_cue
    type: Decal
    image: ./assets/block/glyph_B.png
