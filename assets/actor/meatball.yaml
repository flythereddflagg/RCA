id: meatball
type: MeatBall
children:
  - id: sprite
    type: Decal
  - id: animation
    type: Animation3
    path_prefix: ./assets/actor/meat_ball/
    datafile: base.json
    default_state: wiggle
  
  - id: hitmask
    type: HitMask3
    sibling: animation
    kind: mask
    datafile: base_mask.json

  - id: hurtmask
    type: HitMask3
    sibling: animation
    kind: hurtmask
    datafile: base_mask.json
    groups: [foe]
  
  - id: blockage
    type: Blockage
    mask: ./assets/actor/meat_ball/blockage_mask.png
    start: [870,80]
    scale: 1
    children:
      - id: animation
        type: Animation3
        path_prefix: ./assets/actor/meat_ball/
        datafile: blockage.json
        default_state: still
  
  - id: justball
    type: Decal
    mask: ./assets/actor/meat_ball/just_ball_mask.png
    active: false
    children:
    - id: animation
      type: Animation3
      path_prefix: ./assets/actor/meat_ball/
      datafile: just_ball.json
      default_state: still
  
  - id: music
    type: Music
    filename: ./assets/music/dim_on_top_of_spagoot.mp3
    sequence:
      - [15.671, goto, 0.0]
      