id: meatball
type: MeatBall
children:
  - id: sprite
    type: Decal
  - id: animation
    type: Animation3
    path_prefix: ./assets/actor/meat_ball/
    datafile: base.json
    default_state: wiggle
  
  - id: hitmask
    type: HitMask3
    sibling: animation
    kind: mask
    datafile: base_mask.json