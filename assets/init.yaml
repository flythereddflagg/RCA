### DEBUG SETTINGS ###
# Frame rate (in Frames / second) FPS: 0 -> do not limit FPS
FPS: 90
SHOW_EVENTS: false # print input events in terminal
FPS_COUNTER: true # show FPS on game screen

DEBUG: false # debug mode? (Shows rect frames and positions)
SHOW_MASK: false # in debug mode, shows hit masks of every entity
SHOW_BG_MASK: false # in debug mode, show mask then show bg mask too
LOG_INPUT: false # for recreating bugs (See input.py)
MUSIC: false # in debug mode, MUSIC = False silences all music.

### SCREEN/GAME WINDOW CONSTANTS ###
RESOLUTION: 360
ASPECT_RATIO: [16,9]
SCALE: 2.5
icon: ./assets/block/game_icon_rev1.png
title: pygame - Red Castle Avenger

