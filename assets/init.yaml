# key bindings for keyboard input
key_bind:
  REFRESH: u
  BREAKPOINT: 'y'
  QUIT: backspace
  UP: up
  DOWN: down
  LEFT: left
  RIGHT: right
  BUTTON_S: c
  BUTTON_E: v
  START: return
  # not currently used
  R_UP: w
  R_DOWN: s
  R_LEFT: a
  R_RIGHT: d
  BUTTON_W: z
  BUTTON_N: x
  SELECT: p

# Controller key: 
#   LS/RS: Left/Right Stick
#   LT/RT: Left/Right Trigger
#   LB/RB: Left/Right Bumper
#   X/Y: X/Y button
#   x/y: x/y axes (gives a continuous value as opposed to discrete)
#   Dx/Dy: Dpad x/Dpad y 
#   HM: Home/Xbox button
#   PS: Screenshot button
#   !: No button assigned/used

8BitDo Ultimate 2C Wireless: 
# LSx LSy RSx RSy RTa LTa A B L4 X Y R4 LB RB LT RT - + HM LS RS ! Dx Dy
  LSx LSy RSx RSy !   !   S E !  W N !  LB RB LT RT - + HM LS RS ! Dx Dy
BDA Core (Plus) Wired Controller:
# LSx LSy RSx RSy Y B A X L  R  ZL ZR - + LS RS HM PS Dx Dy
  LSx LSy RSx RSy W S E N LB RB LT RT - + LS RS HM PS Dx Dy

Generic:
  LSx LSy RSx RSy S E W N LB RB LT RT - + LS RS HM PS Dx Dy

ctlr_bind: 
  UP: LSy-
  DOWN: LSy+
  LEFT: LSx-
  RIGHT: LSx+
  BUTTON_S: S
  BUTTON_E: E
  START: +
  SELECT: '-'
  # not currently used
  BUTTON_W: W
  BUTTON_N: 'N'
  R_UP: RSy-
  R_DOWN: RSy+
  R_LEFT: RSx-
  R_RIGHT: RSx+


# Uses XBOX config
SDL2 Controller Bind:
  UP: CONTROLLER_AXIS_LEFTY-
  DOWN: CONTROLLER_AXIS_LEFTY+
  LEFT: CONTROLLER_AXIS_LEFTX-
  RIGHT: CONTROLLER_AXIS_LEFTX+
  R_UP: CONTROLLER_AXIS_RIGHTY-
  R_DOWN: CONTROLLER_AXIS_RIGHTY+
  R_LEFT: CONTROLLER_AXIS_RIGHTX-
  R_RIGHT: CONTROLLER_AXIS_RIGHTX+
  D_UP: CONTROLLER_BUTTON_DPAD_UP
  D_DOWN: CONTROLLER_BUTTON_DPAD_DOWN
  D_LEFT: CONTROLLER_BUTTON_DPAD_LEFT
  D_RIGHT: CONTROLLER_BUTTON_DPAD_RIGHT
  BUTTON_S: CONTROLLER_BUTTON_A
  BUTTON_E: CONTROLLER_BUTTON_B
  BUTTON_W: CONTROLLER_BUTTON_X
  BUTTON_N: CONTROLLER_BUTTON_Y
  BUTTON_L: CONTROLLER_BUTTON_LEFTSHOULDER
  BUTTON_R: CONTROLLER_BUTTON_RIGHTSHOULDER
  STICK_L: CONTROLLER_BUTTON_LEFTSTICK
  STICK_R: CONTROLLER_BUTTON_RIGHTSTICK
  START: CONTROLLER_BUTTON_START
  SELECT: CONTROLLER_BUTTON_BACK
  HOME: CONTROLLER_BUTTON_GUIDE

