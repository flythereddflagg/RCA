### DEBUG SETTINGS ###
# Frame rate ( in Frames / second) DPS:0 => do not limit FPS
FPS: 90
DEBUG: true # show debug info on screen?
SHOW_EVENTS: true # print input events in terminal
FPS_COUNTER: true # show FPS on game screen
SHOW_MASK: false # shows hit masks of every entity when debug = true
SHOW_BG_MASK: false # if debug AND show mask then show bg mask too
LOG_INPUT: false # for recreating bugs (See input.py)

### SCREEN/GAME WINDOW CONSTANTS ###
RESOLUTION: 360
ASPECT_RATIO: [16,9]
SCALE: 2

### GAME INIT ###
init_add_in:
  foreground:
    - yaml: ./assets/actor/player.yaml
      start: [338,450]

# initial_scene: ./assets/scene/mansion_yard.yaml
# initial_scene: ./assets/scene/boss_room.yaml
# initial_scene: ./assets/scene/test_scene.yaml
# initial_scene: ./assets/scene/startup.yaml
initial_scene: ./assets/scene/red_castle_valley.yaml


sprite_groups:
  - solid     # solid entities
  - player    # user-controlled sprites           
  - foe       # enemies


# key bindings for keyboard input
key_bind:
  REFRESH: u
  BREAKPOINT: 'y'
  QUIT: backspace
  UP: up
  DOWN: down
  LEFT: left
  RIGHT: right
  BUTTON_1: c
  BUTTON_2: v
  R_UP: w
  R_DOWN: s
  R_LEFT: a
  R_RIGHT: d
  # not currently used
  BUTTON_3: z
  BUTTON_4: x
  START: return
  SELECT: p

# Controller key: 
#   LS/RS: Left/Right Stick
#   LT/RT: Left/Right Trigger
#   LB/RB: Left/Right Bumper
#   X/Y: X/Y button
#   x/y: x/y axes
#   Dx/Dy: Dpad x/Dpad y 
#   a: gives the continuous "axis" value of an input instead of a binary on/off input (e.g. RTa gives continuous value but RT just gives on or off)
#   Hm: Home/Xbox button
#   Ps: Screenshot button
#   !: No button assigned

8BitDo Fultimate 2C Wireless: 
  LSx LSy RSx RSy RTa LTa A B L4 X Y R4 LB RB LT RT - + Hm LS RS ! Dx Dy
BDA Core (Plus) Wired Controller:
  LSx LSy RSx RSy Y B A X L R ZL ZR - + LS RS Hm Ps Dx Dy
ctlr_bind: 
  QUIT: backspace
  UP: LSy-
  DOWN: LSy+
  LEFT: LSx-
  RIGHT: LSx+
  BUTTON_1: A
  BUTTON_2: B
  START: +
  SELECT: '-'
  # not currently used
  BUTTON_3: X
  BUTTON_4: 'Y'
  R_UP: RSy-
  R_DOWN: RSy+
  R_LEFT: RSx-
  R_RIGHT: RSx+
