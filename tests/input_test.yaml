####
#### COPIED FROM ./assets/init.yaml
####

SHOW_EVENTS: false # print events in terminal

# key bindings for keyboard input
key_bind:
  REFRESH: u
  QUIT: backspace
  START: return
  SELECT: p
  UP: up
  DOWN: down
  LEFT: left
  RIGHT: right
  BUTTON_S: n
  BUTTON_E: m
  BUTTON_W: ','
  BUTTON_N: '.'
  R_UP: i
  R_DOWN: k
  R_LEFT: j
  R_RIGHT: l

# Controller bindings
ctlr_bind:
  REFRESH: 'PrtScn'
  QUIT: '-'
  START: '+'
  SELECT: home
  UP: LSY-
  DOWN: LSY+
  LEFT: LSX-
  RIGHT: LSX+
  BUTTON_S: LT
  BUTTON_E: RT
  BUTTON_W: A 
  BUTTON_N: B
  R_UP: RSY-
  R_DOWN: RSY+
  R_LEFT: RSX-
  R_RIGHT: RSX+

# pygame's controller config list
# CTLR_BUTTON: A,B,X,Y,-,home,+,LS,RS,LB,RB,dUP,dDOWN,dLEFT
CTLR_BUTTON: Y,B,A,X,LB,RB,LT,RT,-,+,LS,RS,home,PrtScn
CTLR_AXES: LSX,LSY,RSX,RSY

